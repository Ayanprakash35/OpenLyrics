name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? A screen recording helps a lot.
    validations:
      required: true
  - type: input
    id: song
    attributes:
      label: Song and player
      placeholder: "Song title — Artist, in Apple Music"
  - type: dropdown
    id: style
    attributes:
      label: Style
      options: [Stack, Lens, Lines]
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Lock screen, Desktop, Both]
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `/usr/bin/log show --last 5m --info --predicate 'subsystem == \"com.openlyrics.app\"'` around the problem."
      render: text
